<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="url(#blueGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Cash Register / POS Terminal Icon -->
  <!-- Screen content (Receipt coming out) -->
  <path d="M44 22 h12 v10 h-12 z" fill="#f8fafc" />
  <line x1="47" y1="25" x2="53" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="47" y1="28" x2="51" y2="28" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Screen bezel -->
  <rect x="34" y="30" width="32" height="26" rx="3" fill="url(#blueGrad)" />
  
  <!-- Screen details -->
  <text x="50" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  
  <!-- Terminal base -->
  <path d="M30 65 h40 l4 10 h-48 z" fill="#475569" />
  
  <!-- Keypad buttons on base -->
  <circle cx="36" cy="69" r="1.5" fill="#cbd5e1" />
  <circle cx="42" cy="69" r="1.5" fill="#cbd5e1" />
  <circle cx="48" cy="69" r="1.5" fill="#cbd5e1" />
  <circle cx="54" cy="69" r="1.5" fill="#cbd5e1" />
  <circle cx="60" cy="69" r="1.5" fill="#cbd5e1" />
  <circle cx="64" cy="69" r="1.5" fill="#22c55e" /> <!-- Green checkout button -->
</svg>